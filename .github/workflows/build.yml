name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle Build Tool
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0'
          cache-disabled: false

      - name: Prepare Secrets Configuration (.env)
        run: |
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            echo "Copying .env.example to .env..."
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Generate Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore for APK signing..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Gradle Wrapper & Permissions
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating Gradle Wrapper files..."
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          fi
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Android Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Locate Generated APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_name=$(basename $APK_PATH)" >> $GITHUB_OUTPUT
          else
            echo "Error: APK not found in app/build/outputs/apk/debug"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: valiant-origin-rpg-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 14
          if-no-files-found: error

      - name: Build Summary
        run: |
          echo "### 🚀 Build APK Sukses!" >> $GITHUB_STEP_SUMMARY
          echo "- **File APK:** \`${{ steps.locate_apk.outputs.apk_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Berhasil dibuild dan siap diunduh di tab Artifacts GitHub Actions." >> $GITHUB_STEP_SUMMARY
