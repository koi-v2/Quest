name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install Platform
        run: |
          echo "Accepting Android SDK licenses..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          echo "Ensuring Android SDK Platform 36 is installed..."
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: false

      - name: Prepare Secrets Configuration (.env)
        run: |
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            echo "Copying .env.example to .env..."
            cp .env.example .env
          else
            touch .env
          fi

      - name: Generate Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore for APK signing..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Gradle Wrapper is ready
        run: |
          echo "Generating Gradle Wrapper with Gradle 9.3.1..."
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: valiant-origin-rpg-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Build Summary
        if: always()
        run: |
          echo "### 📱 Hasil Build APK" >> $GITHUB_STEP_SUMMARY
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1 || true)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "✅ **Status:** Sukses!" >> $GITHUB_STEP_SUMMARY
            echo "- **File:** \`$(basename "$APK_FILE")\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Ukuran:** \`$(du -h "$APK_FILE" | cut -f1)\`" >> $GITHUB_STEP_SUMMARY
            echo "- File APK siap diunduh di bagian **Artifacts** di atas." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Gagal menemukan file APK." >> $GITHUB_STEP_SUMMARY
          fi
