name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment & Platform 36
        run: |
          echo "Setting up Android SDK environment..."
          sudo chown -R $USER:$USER "$ANDROID_HOME" 2>/dev/null || true
          mkdir -p "$ANDROID_HOME/licenses" || true
          # Pre-accept all Android SDK licenses
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78ba6edcb139f66814\n84831b9409646a479e3044d6102e3b29242594d6\n" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          printf "\n85642a8d98d5a1dd5aa911856c374fb504155f70\n28636243926dd6f838bd696a39a52554d485c82f\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true

          SDK_MGR=""
          for p in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$p" ]; then
              SDK_MGR="$p"
              break
            fi
          done

          if [ -n "$SDK_MGR" ]; then
            echo "Using sdkmanager at: $SDK_MGR"
            yes | "$SDK_MGR" --licenses 2>/dev/null || true
            echo "Installing platforms;android-36 and build-tools;36.0.0..."
            "$SDK_MGR" "platforms;android-36" "build-tools;36.0.0" "platform-tools" 2>/dev/null || true
          else
            echo "sdkmanager not found in standard paths, licenses pre-configured in $ANDROID_HOME/licenses."
          fi

      - name: Install Gradle 9.3.1
        run: |
          echo "Downloading official Gradle 9.3.1 distribution..."
          curl -sSL -o /tmp/gradle-9.3.1-bin.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          sudo unzip -q -o /tmp/gradle-9.3.1-bin.zip -d /opt
          sudo rm -f /tmp/gradle-9.3.1-bin.zip
          echo "/opt/gradle-9.3.1/bin" >> $GITHUB_PATH
          echo "GRADLE_HOME=/opt/gradle-9.3.1" >> $GITHUB_ENV

      - name: Verify Gradle Version
        run: |
          gradle --version

      - name: Prepare Secrets Configuration (.env)
        run: |
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            echo "Copying .env.example to .env..."
            cp .env.example .env
          else
            touch .env
          fi

      - name: Generate Debug Keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore for APK signing..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android Debug APK
        run: |
          echo "Executing Gradle assembleDebug..."
          gradle :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Prepare APK Output
        run: |
          mkdir -p apk_output
          FOUND_APK=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
            echo "APK found at: $FOUND_APK"
            cp "$FOUND_APK" apk_output/valiant-origin-rpg-debug.apk
          else
            echo "Warning: APK not found in default path, searching all outputs..."
            find . -name "*.apk" -exec cp {} apk_output/ \;
          fi
          ls -la apk_output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: valiant-origin-rpg-debug-apk
          path: apk_output/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Build Summary
        if: always()
        run: |
          echo "### 📱 Hasil Build APK Android" >> $GITHUB_STEP_SUMMARY
          APK_FILE=$(find apk_output -name "*.apk" 2>/dev/null | head -n 1 || true)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "✅ **Status:** Sukses!" >> $GITHUB_STEP_SUMMARY
            echo "- **File APK:** \`$(basename "$APK_FILE")\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Ukuran File:** \`$(du -h "$APK_FILE" | cut -f1)\`" >> $GITHUB_STEP_SUMMARY
            echo "- Unduh APK langsung di bagian **Artifacts** pada halaman workflow run." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Build gagal atau file APK tidak ditemukan." >> $GITHUB_STEP_SUMMARY
          fi
